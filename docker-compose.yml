version: '3.8'

services:
  ring-signature-monero-clsag:
    build: .
    container_name: ring-signature-monero-clsag
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=ring-signature-monero-clsag-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
