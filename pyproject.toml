[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-signature-monero-clsag"
version = "2.0.0"
description = "CLSAG Compact Linkable Ring Signature & Transaction Anonymizer Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ring-signature-monero-clsag = "ring_clsag_sign.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/ring-signature-monero-clsag"
Repository = "https://github.com/abusuraihsakhri/ring-signature-monero-clsag.git"
