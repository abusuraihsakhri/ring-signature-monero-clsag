[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ring-signature-monero-clsag"
version = "2.0.0"
description = "Rule-based audit demonstration; does not implement Monero CLSAG cryptography"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "ring_clsag_sign_app"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*", "ring_clsag_sign", "ring_clsag_sign.*"]

[project.scripts]
ring-signature-monero-clsag = "ring_clsag_sign.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/ring-signature-monero-clsag"
Repository = "https://github.com/abusuraihsakhri/ring-signature-monero-clsag.git"
